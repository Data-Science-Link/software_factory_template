  - id: deepseek-ai/DeepSeek-V4-Pro-0813
    provider: deepinfra
    price_in_per_mtok: 1.30
    price_cached_per_mtok: 0.10
    price_out_per_mtok: 2.60
    context: 1048576
    thinking: configurable
    status: escalation
    notes: Standard tier.
  - id: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo
    provider: deepinfra
    price_in_per_mtok: 0.30
    price_cached_per_mtok: 0.10
    price_out_per_mtok: 1.00
    context: 262144
    thinking: "off"
    status: fallback
