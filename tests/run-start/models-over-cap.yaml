token_priors:
  simple:
    tokens_in: 50000000
    tokens_cached_fraction: 0.80
    tokens_out: 20000
  standard:
    tokens_in: 1000000
    tokens_cached_fraction: 0.80
    tokens_out: 50000
  complex:
    tokens_in: 800000
    tokens_cached_fraction: 0.70
    tokens_out: 50000

routing_rules:
  - rule: 5
    description: Tool-call or reasoning-format errors on DeepSeek -> Qwen3-Coder
    when:
      error_class: tool_or_reasoning_format
      prior_model_family: deepseek-ai
    model: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo
    also: open_issue_for_model_failure
  - rule: 4
    description: One failed attempt on Flash for standard work -> rerun once on Pro
    when:
      retry: true
      complexity: standard
      escalated_from: deepseek-ai/DeepSeek-V4-Flash-0731
    model: deepseek-ai/DeepSeek-V4-Pro-0813
  - rule: 7
    description: Agent review uses a different model than the builder
    when:
      work_type: review
    model: use_different_model_than_builder
  - rule: 1
    description: High risk or complex work -> V4 Pro
    when:
      any:
        - risk: high
        - complexity: complex
    model: deepseek-ai/DeepSeek-V4-Pro-0813
  - rule: 2
    description: /oc spec run (complex specs only) -> V4 Pro
    when:
      work_type: spec
    model: deepseek-ai/DeepSeek-V4-Pro-0813
  - rule: 3
    description: Default for all other factory worker runs -> V4 Flash
    when: {}
    model: deepseek-ai/DeepSeek-V4-Flash-0731
    tier: standard

checks:
  - rule: 6
    description: Predicted cost above issue cap -> do not run; split the issue first
    when:
      predicted_cost_usd_gt: 1.00
    action: do_not_run_split_issue
  - rule: 8
    description: Standard DeepInfra pricing tier only (no Priority 1.5x unless owner asks)
    when:
      tier_requested: priority
    action: reject_unless_owner_approved

budget:
  deepinfra_monthly_limit_usd: 10
  issue_cap_usd: 1.00
  issue_target_usd: 0.10
  actions_minutes_month: 2000
  actions_minutes_warn_pct: 80
  actions_minute_shadow_usd: 0
