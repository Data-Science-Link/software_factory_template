    tokens_cached_fraction: 0.80
    tokens_out: 50000
  complex:
    tokens_in: 800000
    tokens_cached_fraction: 0.70
    tokens_out: 50000

# Model selection: first match wins (vision §10 rules 5, 4, 7, 2, 9, 1, 3). Order matters.
# `when`: every key at the same level must match (AND). Use `any:` for OR among alternatives.
routing_rules:
  - rule: 5
    description: Tool-call or reasoning-format errors on DeepSeek → Qwen3-Coder; file an issue
    when:
      error_class: tool_or_reasoning_format
      prior_model_family: deepseek-ai
    model: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo
    also: open_issue_for_model_failure

  - rule: 4
    description: One failed attempt on Flash for standard work → rerun once on Pro
    when:
      retry: true
      complexity: standard
      escalated_from: deepseek-ai/DeepSeek-V4-Flash-0731
    model: deepseek-ai/DeepSeek-V4-Pro-0813

  - rule: 7
    description: Agent review uses a different model than the builder
    when:
      work_type: review
    model: use_different_model_than_builder
    notes: Grok Bot review on Cursor plan satisfies this for Actions workers.

  - rule: 2
    description: "/oc spec run on a high-risk issue → V4 Pro (architect); listed before rule 1 so specs always win"
    when:
      work_type: spec
      risk: high
    model: deepseek-ai/DeepSeek-V4-Pro-0813

  - rule: 9
    description: "/oc spec run on any other issue → V4 Flash (trial from #64; Michael, 2026-11-07)"
    when:
      work_type: spec
    model: deepseek-ai/DeepSeek-V4-Flash-0731

  - rule: 1
    description: "High risk or complex work (build/fix) → Qwen3-Coder, fast non-thinking coder (issue 128)"
    when:
      any:
        - risk: high
        - complexity: complex
    model: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo

  - rule: 3
    description: Default for all other factory worker runs → V4 Flash
    when: {}
    model: deepseek-ai/DeepSeek-V4-Flash-0731
    tier: standard

# Guards (vision §10 rules 6 and 8): evaluated on every run after a model is selected.
# Rule 6 uses predicted cost on the chosen model (not the selection list).
checks:
  - rule: 6
    description: Predicted cost above issue cap → do not run; split the issue first
    when:
      predicted_cost_usd_gt: 1.00
    action: do_not_run_split_issue

  - rule: 8
    description: Standard DeepInfra pricing tier only (no Priority 1.5× unless owner asks)
    when:
      tier_requested: priority
    action: reject_unless_owner_approved

# Worked examples for #27 routing script tests (selection → checks).
routing_worked_examples:
  - name: high_risk_predicted_over_cap_not_run
    context:
      risk: high
      complexity: standard
      predicted_cost_usd: 1.20
    expect:
      selected_model: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo
      selected_via_rule: 1
      check_actions: [do_not_run_split_issue]

  - name: high_risk_pro_tool_error_goes_to_qwen
    context:
      risk: high
      error_class: tool_or_reasoning_format
      prior_model_family: deepseek-ai
    expect:
      selected_model: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo
      selected_via_rule: 5
      check_actions: []

  - name: high_risk_spec_run_stays_on_pro
    context:
      risk: high
      complexity: complex
      work_type: spec
    expect:
      selected_model: deepseek-ai/DeepSeek-V4-Pro-0813
      selected_via_rule: 2
      check_actions: []

  - name: normal_risk_spec_run_goes_to_flash
    context:
      risk: normal
      complexity: standard
      work_type: spec
    expect:
      selected_model: deepseek-ai/DeepSeek-V4-Flash-0731
      selected_via_rule: 9
      check_actions: []

  - name: normal_standard_run_goes_to_flash
    context:
      risk: normal
      complexity: standard
      work_type: code
      predicted_cost_usd: 0.033
    expect:
      selected_model: deepseek-ai/DeepSeek-V4-Flash-0731
      selected_via_rule: 3
      check_actions: []

budget:
