# Spike: owner-only /oc on issues → OpenCode (DeepInfra) → scanned artifact → PR.
# Two jobs: agent holds DeepInfra key only; publish holds write GITHUB_TOKEN only.
name: opencode-spike

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  agent:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      startsWith(github.event.comment.body, '/oc') &&
      !startsWith(github.event.comment.body, '/oc spec') &&
      github.event.comment.user.login == 'Data-Science-Link' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    # 20 min: the worker, then the spec's Verification run by script (#76/#80) inside this budget.
    timeout-minutes: 20
    concurrency:
      group: oc-agent-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    outputs:
      # #92: run start's decision and the failure class, for the notify job's comment and marker.
      model_id: ${{ steps.start.outputs.model_id }}
      routed_rule: ${{ steps.start.outputs.routed_rule }}
      refused: ${{ steps.start.outputs.refused }}
      prior_spend_usd: ${{ steps.start.outputs.prior_spend_usd }}
      predicted_cost_usd: ${{ steps.start.outputs.predicted_cost_usd }}
      cap_usd: ${{ steps.start.outputs.cap_usd }}
      error_class: ${{ steps.classify.outputs.error_class }}
    env:
      OC_INSTRUCTION: ${{ github.event.comment.body }}
      OC_ISSUE_NUMBER: ${{ github.event.issue.number }}
      OC_ARTIFACT_DIR: /tmp/oc-artifacts
      # Seconds the agent script may use before it stops starting work (verification is
      # trimmed or skipped to fit); leaves ~3 minutes of the job for the scan and upload.
      OC_AGENT_BUDGET_SECONDS: "1020"
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: |
            api.deepinfra.com:443
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          
      - name: Fetch issue context (read-only token, this step only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/opencode-build-context.py

      # #91/#92: the model (models.yaml routing, retry/fallback from trusted failure markers) and
      # the per-issue cap are decided here by script, before OpenCode is installed or the key is
      # used. A refusal (exit 3) stops the job; the notify job posts the reason.
      - name: Run start (route the model, check the issue cap; read-only token, this step only)
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
          OC_KIND: build
        run: bash scripts/factory-run-start.sh

      - name: Install gitleaks
        run: bash scripts/install-gitleaks-ci.sh

      - name: Install OpenCode (pinned)
        run: bash scripts/opencode-install.sh

      - name: Run OpenCode agent
        id: agent
        env:
          # #92: the key is in this step only; OC_MODEL is exactly run start's routed model.
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          OC_MODEL: ${{ steps.start.outputs.model_id }}
        run: bash scripts/opencode-agent-run.sh

      # #92: only when the worker step itself failed: tool-call / reasoning-format failure or not
      # (models.yaml rule 5). No class = not a worker failure, so the next run start won't retry on it.
      - name: Classify a failed worker run
        id: classify
        if: always() && steps.agent.outcome == 'failure'
        run: python3 scripts/factory-classify-failure.py --log "$OC_ARTIFACT_DIR/opencode.log"

      - name: Usage report (always)
        if: always()
        run: bash scripts/opencode-usage-report.sh

      # #89: a failed or cancelled run still leaves its usage and log (scanned first; never uploaded on a hit).
      - name: Upload failure diagnostics (scanned)
        if: failure() || cancelled()
        id: diag
        run: |
          set -euo pipefail
          files=()
          for f in usage-metrics.md usage-report.txt opencode.log; do
            [ -f "$OC_ARTIFACT_DIR/$f" ] && files+=("$OC_ARTIFACT_DIR/$f")
          done
          [ "${#files[@]}" -gt 0 ] || exit 0
          bash scripts/opencode-artifact-scan.sh "${files[@]}"
          echo "ok=yes" >>"$GITHUB_OUTPUT"

      - name: Upload failure diagnostics artifact
        if: (failure() || cancelled()) && steps.diag.outputs.ok == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-diagnostics-${{ github.run_id }}
          path: |
            ${{ env.OC_ARTIFACT_DIR }}/usage-metrics.md
            ${{ env.OC_ARTIFACT_DIR }}/usage-report.txt
            ${{ env.OC_ARTIFACT_DIR }}/opencode.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload agent artifacts
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-artifacts-${{ github.run_id }}
          path: ${{ env.OC_ARTIFACT_DIR }}/
          if-no-files-found: error

  publish:
    needs: agent
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # Read-only: publish re-fetches the approved spec comment to check the committed spec file (#75).
      issues: read
    env:
      OC_ISSUE_NUMBER: ${{ github.event.issue.number }}
      OC_RUN_ID: ${{ github.run_id }}
      OC_ARTIFACT_DIR: /tmp/oc-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: bash scripts/install-gitleaks-ci.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oc-artifacts-${{ github.run_id }}
          path: ${{ env.OC_ARTIFACT_DIR }}

      - name: Open pull request from patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/opencode-publish-pr.sh

      - name: Job summary (no secrets)
        run: |
          {
            echo "### OpenCode spike publish"
            echo "- Issue: #${OC_ISSUE_NUMBER}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${OC_RUN_ID}"
            if [ -f "${OC_ARTIFACT_DIR}/usage-metrics.md" ]; then
              echo ""
              cat "${OC_ARTIFACT_DIR}/usage-metrics.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # #84: one script-worded comment when the agent or publish job fails or is cancelled, including
  # a run start refusal (#92: the reason and cap numbers, "no DeepInfra spend"). Its marker line
  # records the routed model and failure class, which the next run start reads for rules 4 and 5.
  # Separate job so it still runs after a timeout, and the write token never sits next to the key.
  notify:
    needs: [agent, publish]
    if: always() && needs.agent.result != 'skipped' && (needs.agent.result != 'success' || needs.publish.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post one failure comment (wording from the script)
        env:
          GH_TOKEN: ${{ github.token }}
          OC_KIND: build
          OC_TARGET_NUMBER: ${{ github.event.issue.number }}
          OC_RUN_ID: ${{ github.run_id }}
          OC_RUN_ATTEMPT: ${{ github.run_attempt }}
          OC_AGENT_RESULT: ${{ needs.agent.result }}
          OC_PUBLISH_RESULT: ${{ needs.publish.result }}
          OC_REFUSED: ${{ needs.agent.outputs.refused }}
          OC_MODEL_ID: ${{ needs.agent.outputs.model_id }}
          OC_ROUTED_RULE: ${{ needs.agent.outputs.routed_rule }}
          OC_ERROR_CLASS: ${{ needs.agent.outputs.error_class }}
          OC_PRIOR_USD: ${{ needs.agent.outputs.prior_spend_usd }}
          OC_PREDICTED_USD: ${{ needs.agent.outputs.predicted_cost_usd }}
          OC_CAP_USD: ${{ needs.agent.outputs.cap_usd }}
        run: bash scripts/opencode-notify-failure.sh
