# /oc spec (#78): owner-only "/oc spec [guidance]" on an issue → a READ-ONLY OpenCode worker on
# DeepSeek V4 Pro (models.yaml rule 2, set by scripts/opencode-spec-run.sh) drafts a spec →
# scripts check it and post it as a DRAFT spec comment. No repo write, no PR.
# Two jobs: agent holds the DeepInfra key and read tokens only; publish holds issues: write only.
# Approval stays the existing convention: the owner posts the approved copy
# (scripts/factory-approve-spec.py); /oc never reads a draft.
name: opencode-spec

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  agent:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      startsWith(github.event.comment.body, '/oc spec') &&
      github.event.comment.user.login == 'Data-Science-Link' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: oc-spec-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    env:
      OC_INSTRUCTION: ${{ github.event.comment.body }}
      OC_ISSUE_NUMBER: ${{ github.event.issue.number }}
      OC_ARTIFACT_DIR: /tmp/oc-artifacts
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: |
            api.deepinfra.com:443
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch issue context (read-only token, this step only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/opencode-build-context.py

      - name: Install gitleaks
        run: bash scripts/install-gitleaks-ci.sh

      - name: Install OpenCode (pinned)
        run: bash scripts/opencode-install.sh

      - name: Draft the spec (read-only worker)
        run: bash scripts/opencode-spec-run.sh

      - name: Usage report (always)
        if: always()
        run: bash scripts/opencode-usage-report.sh

      - name: Upload spec artifacts
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-spec-${{ github.run_id }}
          path: ${{ env.OC_ARTIFACT_DIR }}/
          if-no-files-found: error

  publish:
    needs: agent
    # Also after a failed agent job, so the issue gets a "no draft" note with the run link.
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      OC_ISSUE_NUMBER: ${{ github.event.issue.number }}
      OC_RUN_ID: ${{ github.run_id }}
      OC_ARTIFACT_DIR: /tmp/oc-artifacts
      OC_AGENT_RESULT: ${{ needs.agent.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: bash scripts/install-gitleaks-ci.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.agent.result == 'success'
        with:
          name: oc-spec-${{ github.run_id }}
          path: ${{ env.OC_ARTIFACT_DIR }}

      - name: Post the draft spec comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/opencode-publish-spec.sh
