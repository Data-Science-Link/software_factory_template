# Static analysis for workflow YAML (actionlint + zizmor). Runs only when
# workflow files change. See .factory/repo-security-baseline.md.
name: workflow-lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: actionlint
        uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7

      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: "false"
          online-audits: "false"
