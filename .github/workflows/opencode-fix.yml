# /oc fix: owner-only follow-up run on an EXISTING bot PR (issue #55).
# An owner comment starting with "/oc fix" on a same-repo PR whose head is oc/issue-<N>-<run_id>
# → OpenCode (DeepInfra) applies the owner's review fixes on the PR head → scanned artifact →
# one commit pushed to the SAME branch (lease on the head job A saw) + a run-facts PR comment.
# Same split as opencode-spike.yml: agent holds the DeepInfra key and read tokens only;
# publish holds the write GITHUB_TOKEN only. Never merges, never opens a new PR.
# Known gap (#74): pull_request runs from a GITHUB_TOKEN push wait for approval; approve them on the
# PR or close/reopen it as the owner (scripts/factory-kick-checks.sh).
name: opencode-fix

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  agent:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/oc fix') &&
      github.event.comment.user.login == 'Data-Science-Link' &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    # 20 min: the worker, then the spec's Verification run by script (#76/#80) inside this budget.
    timeout-minutes: 20
    concurrency:
      group: oc-fix-agent-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.ctx.outputs.head_sha }}
    env:
      OC_INSTRUCTION: ${{ github.event.comment.body }}
      OC_PR_NUMBER: ${{ github.event.issue.number }}
      OC_ARTIFACT_DIR: /tmp/oc-artifacts
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      # Seconds the agent script may use before it stops starting work (verification is
      # trimmed or skipped to fit); leaves ~3 minutes of the job for the scan and upload.
      OC_AGENT_BUDGET_SECONDS: "1020"
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
          allowed-endpoints: |
            api.deepinfra.com:443
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # Trusted scripts and opencode.json: the default branch, not the PR.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Guards (open, same repo, never a fork, head oc/issue-<N>-<run_id>, base = default branch)
      # and builds the fix context: linked issue + approved spec, PR file list, owner review and
      # PR comments since the last push (capped, untrusted data). Outputs a validated head_sha.
      - name: Guard PR and fetch fix context (read-only token, this step only)
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/opencode-build-fix-context.py

      - name: Check out the PR head (the SHA the context was built from)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.ctx.outputs.head_sha }}
          path: pr
          fetch-depth: 1
          persist-credentials: false

      - name: Install gitleaks
        run: bash scripts/install-gitleaks-ci.sh

      - name: Install OpenCode (pinned)
        run: bash scripts/opencode-install.sh

      - name: Run OpenCode fix agent
        env:
          OC_PR_DIR: ${{ github.workspace }}/pr
        run: bash scripts/opencode-agent-fix.sh

      - name: Usage report (always)
        if: always()
        run: bash scripts/opencode-usage-report.sh

      - name: Upload agent artifacts
        if: success()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: oc-fix-artifacts-${{ github.run_id }}
          path: ${{ env.OC_ARTIFACT_DIR }}/
          if-no-files-found: error

  publish:
    needs: agent
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: oc-fix-publish-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      # Read-only: publish re-fetches the approved spec comment to check the committed spec file (#75).
      issues: read
    env:
      OC_PR_NUMBER: ${{ github.event.issue.number }}
      OC_RUN_ID: ${{ github.run_id }}
      OC_ARTIFACT_DIR: /tmp/oc-artifacts
      OC_EXPECTED_HEAD_SHA: ${{ needs.agent.outputs.head_sha }}
    steps:
      # Trusted scripts (pristine HEAD copies are taken from this checkout).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out the PR head job A worked on
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.agent.outputs.head_sha }}
          path: pr
          fetch-depth: 1
          persist-credentials: false

      - name: Install gitleaks
        run: bash scripts/install-gitleaks-ci.sh

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: oc-fix-artifacts-${{ github.run_id }}
          path: ${{ env.OC_ARTIFACT_DIR }}

      # Re-guards via the API (refuses if the head moved), scans, applies, pushes one commit to
      # the same branch with --force-with-lease=<branch>:<job A head>, then comments on the PR.
      - name: Push fix commit and comment run facts
        env:
          GH_TOKEN: ${{ github.token }}
          OC_PR_DIR: ${{ github.workspace }}/pr
        run: |
          git -C "$OC_PR_DIR" config user.name "github-actions[bot]"
          git -C "$OC_PR_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/opencode-publish-fix.sh

      - name: Job summary (no secrets)
        if: always()
        run: |
          {
            echo "### OpenCode fix publish"
            echo "- PR: #${OC_PR_NUMBER}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${OC_RUN_ID}"
            echo "- Checks: pr-check and gitleaks wait for approval on GITHUB_TOKEN pushes (#74): approve them on the PR, or run scripts/factory-kick-checks.sh ${OC_PR_NUMBER}."
            if [ -f "${OC_ARTIFACT_DIR}/usage-metrics.md" ]; then
              echo ""
              cat "${OC_ARTIFACT_DIR}/usage-metrics.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
