# /oc fix: owner-only follow-up run on an EXISTING bot PR (issue #55).
# An owner comment starting with "/oc fix" on a same-repo PR whose head is oc/issue-<N>-<run_id>
# → OpenCode (DeepInfra) applies the owner's review fixes on the PR head → scanned artifact →
# one commit pushed to the SAME branch (lease on the head job A saw) + a run-facts PR comment.
# Same split as opencode-spike.yml: agent holds the DeepInfra key and read tokens only;
# publish holds the write GITHUB_TOKEN only. Never merges, never opens a new PR.
# Known gap (#74): pull_request runs from a GITHUB_TOKEN push wait for approval; approve them on the
# PR or close/reopen it as the owner (scripts/factory-kick-checks.sh).
name: opencode-fix

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  agent:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/oc fix') &&
      github.event.comment.user.login == 'Data-Science-Link' &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    # 20 min: the worker, then the spec's Verification run by script (#76/#80) inside this budget.
    timeout-minutes: 20
    concurrency:
      group: oc-fix-agent-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.ctx.outputs.head_sha }}
      # #92: run start's decision and the failure class, for the notify job's comment and marker.
      model_id: ${{ steps.start.outputs.model_id }}
      routed_rule: ${{ steps.start.outputs.routed_rule }}
      refused: ${{ steps.start.outputs.refused }}
      prior_spend_usd: ${{ steps.start.outputs.prior_spend_usd }}
      predicted_cost_usd: ${{ steps.start.outputs.predicted_cost_usd }}
      cap_usd: ${{ steps.start.outputs.cap_usd }}
      error_class: ${{ steps.classify.outputs.error_class }}
    env:
      OC_INSTRUCTION: ${{ github.event.comment.body }}
      OC_PR_NUMBER: ${{ github.event.issue.number }}
      OC_ARTIFACT_DIR: /tmp/oc-artifacts
      # #31: run metering output (scripts/opencode-run-meter.sh), kept apart from oc-artifacts.
      OC_RECORD_DIR: /tmp/oc-record
      # Seconds the agent script may use before it stops starting work (verification is
      # trimmed or skipped to fit); leaves ~3 minutes of the job for the scan and upload.
      OC_AGENT_BUDGET_SECONDS: "1020"
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: |
            api.deepinfra.com:443
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # Trusted scripts and opencode.json: the default branch, not the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Guards (open, same repo, never a fork, head oc/issue-<N>-<run_id>, base = default branch)
      # and builds the fix context: linked issue + approved spec, PR file list, owner review and
      # PR comments since the last push (capped, untrusted data). Outputs a validated head_sha.
      - name: Guard PR and fetch fix context (read-only token, this step only)
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/opencode-build-fix-context.py

      # #91/#92: routed from the LINKED issue's approved spec (risk/complexity) and that issue's
      # spend, plus fix-run failure markers on this PR; decided before OpenCode is installed or the
      # key is used. A refusal (exit 3) stops the job; the notify job posts the reason.
      - name: Run start (route the model, check the issue cap; read-only token, this step only)
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
          OC_KIND: fix
        run: bash scripts/factory-run-start.sh

      - name: Check out the PR head (the SHA the context was built from)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ctx.outputs.head_sha }}
          path: pr
          fetch-depth: 1
          persist-credentials: false

      - name: Install gitleaks
        run: bash scripts/install-gitleaks-ci.sh

      - name: Install OpenCode (pinned)
        run: bash scripts/opencode-install.sh

      - name: Run OpenCode fix agent
        id: agent
        env:
          OC_PR_DIR: ${{ github.workspace }}/pr
          # #92: the key is in this step only; OC_MODEL is exactly run start's routed model.
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          # #31: the Actions key's name (repo variable, not a secret) for the key-spend snapshot.
          FACTORY_DEEPINFRA_KEY_NAME: ${{ vars.FACTORY_DEEPINFRA_KEY_NAME }}
          OC_MODEL: ${{ steps.start.outputs.model_id }}
        run: bash scripts/opencode-agent-fix.sh

      # #92: only when the worker step itself failed: tool-call / reasoning-format failure or not
      # (models.yaml rule 5). No class = not a worker failure, so the next run start won't retry on it.
      - name: Classify a failed worker run
        id: classify
        if: always() && steps.agent.outcome == 'failure'
        run: python3 scripts/factory-classify-failure.py --log "$OC_ARTIFACT_DIR/opencode.log"

      - name: Usage report (always)
        if: always()
        run: bash scripts/opencode-usage-report.sh

      # #31: the run's metering (run clock, sanitized session exports, key spend) plus run-start.json,
      # spec.md and fix-meta.txt, scanned, for the record job. Pristine copies of the scripts from the triggering commit
      # (the worker's tree may have changed scripts/). An export with a scan hit is dropped.
      - name: Pack run record inputs (scanned, always)
        id: pack
        if: always()
        run: |
          d="$(mktemp -d)"
          git show "$GITHUB_SHA:scripts/factory-run-pack.sh" >"$d/pack.sh"
          git show "$GITHUB_SHA:scripts/opencode-artifact-scan.sh" >"$d/scan.sh"
          OC_SCAN_SH="$d/scan.sh" bash "$d/pack.sh"

      - name: Upload run record inputs
        if: always() && steps.pack.outputs.ok == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-record-${{ github.run_id }}
          path: ${{ env.OC_RECORD_DIR }}/
          if-no-files-found: ignore
          retention-days: 30

      # #89: a failed or cancelled run still leaves its usage and log (scanned first; never uploaded on a hit).
      - name: Upload failure diagnostics (scanned)
        if: failure() || cancelled()
        id: diag
        run: |
          set -euo pipefail
          files=()
          for f in usage-metrics.md usage-report.txt opencode.log; do
            [ -f "$OC_ARTIFACT_DIR/$f" ] && files+=("$OC_ARTIFACT_DIR/$f")
          done
          [ "${#files[@]}" -gt 0 ] || exit 0
          bash scripts/opencode-artifact-scan.sh "${files[@]}"
          echo "ok=yes" >>"$GITHUB_OUTPUT"

      - name: Upload failure diagnostics artifact
        if: (failure() || cancelled()) && steps.diag.outputs.ok == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-diagnostics-${{ github.run_id }}
          path: |
            ${{ env.OC_ARTIFACT_DIR }}/usage-metrics.md
            ${{ env.OC_ARTIFACT_DIR }}/usage-report.txt
            ${{ env.OC_ARTIFACT_DIR }}/opencode.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload agent artifacts
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-fix-artifacts-${{ github.run_id }}
          path: ${{ env.OC_ARTIFACT_DIR }}/
          if-no-files-found: error

  publish:
    needs: agent
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: oc-fix-publish-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      # Read-only: publish re-fetches the approved spec comment to check the committed spec file (#75).
      issues: read
    env:
      OC_PR_NUMBER: ${{ github.event.issue.number }}
      OC_RUN_ID: ${{ github.run_id }}
      OC_ARTIFACT_DIR: /tmp/oc-artifacts
      OC_EXPECTED_HEAD_SHA: ${{ needs.agent.outputs.head_sha }}
    steps:
      # Trusted scripts (pristine HEAD copies are taken from this checkout).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the PR head job A worked on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.agent.outputs.head_sha }}
          path: pr
          fetch-depth: 1
          persist-credentials: false

      - name: Install gitleaks
        run: bash scripts/install-gitleaks-ci.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oc-fix-artifacts-${{ github.run_id }}
          path: ${{ env.OC_ARTIFACT_DIR }}

      # Re-guards via the API (refuses if the head moved), scans, applies, pushes one commit to
      # the same branch with --force-with-lease=<branch>:<job A head>, then comments on the PR.
      - name: Push fix commit and comment run facts
        env:
          GH_TOKEN: ${{ github.token }}
          OC_PR_DIR: ${{ github.workspace }}/pr
        run: |
          git -C "$OC_PR_DIR" config user.name "github-actions[bot]"
          git -C "$OC_PR_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/opencode-publish-fix.sh

      - name: Job summary (no secrets)
        if: always()
        run: |
          {
            echo "### OpenCode fix publish"
            echo "- PR: #${OC_PR_NUMBER}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${OC_RUN_ID}"
            echo "- Checks: pr-check and gitleaks wait for approval on GITHUB_TOKEN pushes (#74): approve them on the PR, or run scripts/factory-kick-checks.sh ${OC_PR_NUMBER}."
            if [ -f "${OC_ARTIFACT_DIR}/usage-metrics.md" ]; then
              echo ""
              cat "${OC_ARTIFACT_DIR}/usage-metrics.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # #84: one script-worded comment when the agent or publish job fails or is cancelled, including
  # a run start refusal (#92: the reason and cap numbers, "no DeepInfra spend"). Its marker line
  # records the routed model and failure class, which the next run start reads for rules 4 and 5.
  # Separate job so it still runs after a timeout, and the write token never sits next to the key.
  notify:
    needs: [agent, publish]
    if: always() && needs.agent.result != 'skipped' && (needs.agent.result != 'success' || needs.publish.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post one failure comment (wording from the script)
        env:
          GH_TOKEN: ${{ github.token }}
          OC_KIND: fix
          OC_TARGET_NUMBER: ${{ github.event.issue.number }}
          OC_RUN_ID: ${{ github.run_id }}
          OC_RUN_ATTEMPT: ${{ github.run_attempt }}
          OC_AGENT_RESULT: ${{ needs.agent.result }}
          OC_PUBLISH_RESULT: ${{ needs.publish.result }}
          OC_REFUSED: ${{ needs.agent.outputs.refused }}
          OC_MODEL_ID: ${{ needs.agent.outputs.model_id }}
          OC_ROUTED_RULE: ${{ needs.agent.outputs.routed_rule }}
          OC_ERROR_CLASS: ${{ needs.agent.outputs.error_class }}
          OC_PRIOR_USD: ${{ needs.agent.outputs.prior_spend_usd }}
          OC_PREDICTED_USD: ${{ needs.agent.outputs.predicted_cost_usd }}
          OC_CAP_USD: ${{ needs.agent.outputs.cap_usd }}
        run: bash scripts/opencode-notify-failure.sh

  # #31: after every run that reached the worker (success, failure, timeout or cancel): build the
  # run record (factory-run-end.sh: tokens x price table, checked against the key-spend delta), post
  # it on the issue under <!-- factory-run-record --> (run start reads these for prior spend), and
  # on a PR rewrite the factory-run block and Cost: line. No DeepInfra key; default-branch scripts.
  record:
    needs: [agent, publish]
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      # Read-only: gh run list, to mark key spend "concurrent" when another /oc run overlapped.
      actions: read
    env:
      OC_RECORD_DIR: /tmp/oc-record
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: oc-record-${{ github.run_id }}
          path: ${{ env.OC_RECORD_DIR }}

      - name: Record the run (issue comment, PR cost block)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OC_KIND: fix
          OC_ARTIFACT_DIR: ${{ env.OC_RECORD_DIR }}
          OC_ISSUE_NUMBER: ${{ github.event.issue.number }}
          OC_AGENT_RESULT: ${{ needs.agent.result }}
          OC_PUBLISH_RESULT: ${{ needs.publish.result }}
          OC_REFUSED: ${{ needs.agent.outputs.refused }}
          OC_TRIGGER_URL: ${{ github.event.comment.html_url }}
          OC_RECORD_OUT: /tmp/oc-record-out/run-record.json
        run: bash scripts/factory-run-finish.sh

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oc-run-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/oc-record-out/
          if-no-files-found: ignore
          retention-days: 90
