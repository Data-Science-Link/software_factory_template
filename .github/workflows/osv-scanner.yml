# OSV-Scanner for dependency vulnerabilities on private repos where CodeQL
# default setup may require a paid plan. Reports only (non-blocking until tuned).
name: osv-scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 4 * * 3"

permissions: {}

jobs:
  scan:
    if: github.event.repository.visibility != 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    env:
      OSV_VERSION: "2.7.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install OSV-Scanner (pinned)
        run: |
          set -euo pipefail
          file="osv-scanner_linux_amd64"
          curl -sSfL -o "$file" "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/${file}"
          curl -sSfL -o SHA256SUMS "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_SHA256SUMS"
          grep " ${file}$" SHA256SUMS | sha256sum -c -
          chmod +x "$file"
          sudo mv "$file" /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan repository
        run: |
          set +e
          osv-scanner scan --recursive ./
          code=$?
          if [ "$code" -eq 128 ]; then
            echo "No package manifests to scan (expected for docs/shell-only repos)."
            exit 0
          fi
          exit "$code"
