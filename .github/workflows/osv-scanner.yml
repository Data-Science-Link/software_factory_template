# OSV-Scanner for dependency vulnerabilities on private repos where CodeQL
# default setup may require a paid plan. Reports only (non-blocking until tuned).
name: osv-scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 4 * * 3"

permissions: {}

jobs:
  scan:
    if: github.event.repository.visibility != 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: OSV-Scanner
        uses: google/osv-scanner-action@764c91816374ff2d8fc209dab36eecd42d61638 # v1.9.2
        with:
          scan-args: |-
            --recursive
            ./
