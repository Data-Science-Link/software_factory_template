# PR check: holds every PR body to a few factory rules (issue link, AI
# disclosure, Cost line for Local open-weights runs). Script only: no model,
# no spend. Rules live in scripts/pr-check.sh.
name: pr-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  run-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install factory Python requirements
        run: pip install -r requirements-factory.txt

      - name: Run run-record fixture tests
        run: bash scripts/test-run-records.sh

  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python for factory spec-check tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install factory Python dependencies
        run: python -m pip install -r requirements-factory.txt

      - name: Run factory spec-check tests
        run: bash scripts/test-spec-check.sh

      - name: Check the PR body against the factory rules
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Passed through env, never pasted into the script, so the body can't run as code.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          PR_FILES="$(gh pr diff "$PR_NUMBER" --name-only --repo "$GITHUB_REPOSITORY")"
          export PR_FILES
          bash scripts/pr-check.sh
          bash scripts/test-opencode-capture-usage.sh
